name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # setiap hari jam 05:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests lxml

      - name: Fetch & Merge EPG
        run: python scripts/fetch_epg.py

      - name: Commit & Push EPG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg.xml
          git commit -m "Update EPG $(date +'%Y-%m-%d')" || echo "No changes"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/arisuddin/epg.git
